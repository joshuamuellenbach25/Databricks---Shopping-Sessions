[package]
name = "solver"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
hashbrown = "0.17"
memchr = "2.8"
memmap2 = "0.9"
parquet = { version = "60", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
